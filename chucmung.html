<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Valentine</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(180deg, #ffd6e0 0%, #ffb6c1 100%);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Hiệu ứng xuất hiện mượt */
    .birthday-card {
      text-align: center;
      background: rgba(255, 255, 255, 0.35);
      padding: 30px 50px;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(255, 105, 180, 0.35);
      backdrop-filter: blur(10px);
      z-index: 10;
      opacity: 0;
      transform: scale(0.9);
      animation: fadeIn 1.5s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Hiệu ứng chữ */
    .birthday-card h2 {
      color: #ff2e63;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(255, 0, 100, 0.5);
      animation: glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ff7eb9, 0 0 20px #ff2e63; }
      to { text-shadow: 0 0 20px #ff2e63, 0 0 40px #ff7eb9; }
    }

    .birthday-card p {
      color: #000;
      font-size: 18px;
      margin: 6px 0;
    }

    /* Nút mở quà */
    .btn {
      margin-top: 20px;
      background: linear-gradient(90deg, #ff4da6, #ff1f8f);
      border: none;
      color: white;
      font-size: 17px;
      padding: 14px 28px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 100, 180, 0.6);
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 0 25px rgba(255, 50, 150, 0.9);
    }

    /* Tim rơi và bay */
    .hearts-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .heart {
      position: absolute;
      width: 18px;
      height: 18px;
      background-color: #ff2e63;
      transform: rotate(45deg);
      animation: float 6s linear forwards;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background-color: #ff2e63;
      border-radius: 50%;
    }

    .heart::before { top: -9px; left: 0; }
    .heart::after { left: 9px; top: 0; }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 0;
      }
    }

    @keyframes rise {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(45deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="hearts-container"></div>

  <div class="birthday-card">
    <h2>Happy Birthday</h2>
     <p>
        Chúc mừng sinh nhật công chúa của anh.<br><br>
        Em là vì sao đẹp nhất trong vũ trụ của anh…<br><br>
        Chúc em luôn tỏa sáng, dịu dàng và hạnh phúc mỗi ngày.<br><br>
        Cảm ơn em vì đã xuất hiện trong cuộc đời anh,
        vì đã là điều ngọt ngào và tuyệt vời nhất.
    </p>
    <button class="btn" onclick="window.location.href='album.html'">MỞ QUÀ NÈ 🎁</button>
  </div>

  <script>
    const heartsContainer = document.querySelector('.hearts-container');

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');

      const isRising = Math.random() > 0.5; // nửa tim bay lên, nửa rơi xuống
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.backgroundColor = Math.random() > 0.5 ? '#ff4da6' : '#ff2e63';
      heart.style.animationName = isRising ? 'rise' : 'float';
      heart.style.animationDuration = (4 + Math.random() * 4) + 's';
      heart.style.opacity = Math.random() * 0.8 + 0.4;

      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }

    setInterval(createHeart, 300);
  </script>
</body>
</html>
