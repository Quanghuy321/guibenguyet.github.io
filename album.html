<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album Ảnh Valentine</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #ffc0cb;
      height: 100vh;
      font-family: "Poppins", sans-serif;
      position: relative;
    }

    /* Tim rơi */
    .hearts-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .heart {
      position: absolute;
      top: -10px;
      width: 20px;
      height: 20px;
      background-color: #ff2e63;
      transform: rotate(45deg);
      animation: fall linear forwards;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #ff2e63;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: 10px;
      top: 0;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(45deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
    }

    /* Ảnh bay ngang */
    .photo {
      position: absolute;
      width: 200px;
      height: 260px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      border: 3px solid #fff;
      object-fit: cover;
      z-index: 2;
      animation: flyAcross 20s linear infinite;
    }

    @keyframes flyAcross {
      0% {
        transform: translateX(-300px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateX(120vw) rotate(10deg);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="hearts-container"></div>

  <!-- Ảnh xuất hiện cùng lúc, cách đều nhau -->
  <img src="image.png" class="photo" style="top:5%; animation-delay: 0s;">
  <img src="image1.png" class="photo" style="top:20%; animation-delay: -3s;">
  <img src="image2.png" class="photo" style="top:35%; animation-delay: -6s;">
  <img src="image1.png" class="photo" style="top:50%; animation-delay: -9s;">
  <img src="image.png" class="photo" style="top:65%; animation-delay: -12s;">
  <img src="image2.png" class="photo" style="top:80%; animation-delay: -15s;">
  <img src="image1.png" class="photo" style="top:15%; animation-delay: -18s;">
  <img src="image.png" class="photo" style="top:65%; animation-delay: -24s;">
  

  <script>
    // Hiệu ứng tim rơi
    const heartsContainer = document.querySelector('.hearts-container');
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = 3 + Math.random() * 3 + 's';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 400);
  </script>
</body>
</html>
