<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe5ed">
  <title>Album ảnh kỷ niệm 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="album-page">
  <div class="hearts-container" aria-hidden="true"></div>
  <header class="album-heading"><h1>Album của chúng mình 💗</h1><p>Một chút kỷ niệm thật đáng yêu</p></header>
  <main class="album-grid" aria-label="Album ảnh kỷ niệm">
   <div class="album-loop">
    <div class="album-track">
      <img class="album-img" src="image.png" alt="Kỷ niệm 1">
      <img class="album-img" src="image1.png" alt="Kỷ niệm 2">
      <img class="album-img" src="image2.png" alt="Kỷ niệm 3">
      <img class="album-img" src="image1.png" alt="Kỷ niệm 4">
      <img class="album-img" src="image.png" alt="Kỷ niệm 5">
      <img class="album-img" src="image2.png" alt="Kỷ niệm 6">
      <img class="album-img" src="image1.png" alt="Kỷ niệm 7">
      <img class="album-img" src="image.png" alt="Kỷ niệm 8">
    </div>
    <div class="album-track" aria-hidden="true">
      <img class="album-img" src="image.png" alt="">
      <img class="album-img" src="image1.png" alt="">
      <img class="album-img" src="image2.png" alt="">
      <img class="album-img" src="image1.png" alt="">
      <img class="album-img" src="image.png" alt="">
      <img class="album-img" src="image2.png" alt="">
      <img class="album-img" src="image1.png" alt="">
      <img class="album-img" src="image.png" alt="">
    </div>
   </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
